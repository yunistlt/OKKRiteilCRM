# Временный вход для проверки переезда (23.10.2026): наше приложение на своём
# сервере, порт 3000, БОЕВАЯ база. Людям этот адрес не раздаём.
#
# Почему 8444, а не 8443, как в плане: 8443 уже занят тестовым стендом на
# тестовой базе (okk-staging.conf, поднят 22.10.2026) — его не трогаем.
#
# После переключения (этап 3) этот файл убираем: боевой трафик пойдёт на
# 127.0.0.1:3000 через обычный 443.
server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name okk.zmksoft.com;

    ssl_certificate     /etc/letsencrypt/live/okk.zmksoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okk.zmksoft.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Чтобы проверочный адрес не попал в поиск и в чужие закладки.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host okk.zmksoft.com;
        # Вебсокет мессенджера и всплывающее окно звонка
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
    }
}
